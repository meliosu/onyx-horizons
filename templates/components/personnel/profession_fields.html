<h3 class="text-lg font-medium mb-4">{{ profession | capitalize }} Details</h3>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {% match profession %}
        {% when WorkerProfession::Electrician %}
            <div>
                <label for="voltage_specialization" class="block text-sm font-medium text-gray-700 mb-1">Voltage Specialization *</label>
                <input type="text" name="voltage_specialization" id="voltage_specialization" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                      value="{% if let Some(ProfessionDetails::Electrician(e)) = details %}{{ e.voltage_specialization }}{% endif %}">
            </div>
            
        {% when WorkerProfession::Plumber %}
            <div>
                <label for="pipe_specialization" class="block text-sm font-medium text-gray-700 mb-1">Pipe Specialization *</label>
                <input type="text" name="pipe_specialization" id="pipe_specialization" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                      value="{% if let Some(ProfessionDetails::Plumber(p)) = details %}{{ p.pipe_specialization }}{% endif %}">
            </div>
            
        {% when WorkerProfession::Welder %}
            <div>
                <label for="welding_machine" class="block text-sm font-medium text-gray-700 mb-1">Welding Machine *</label>
                <input type="text" name="welding_machine" id="welding_machine" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                      value="{% if let Some(ProfessionDetails::Welder(w)) = details %}{{ w.welding_machine }}{% endif %}">
            </div>
            
        {% when WorkerProfession::Driver %}
            <div>
                <label for="vehicle_type" class="block text-sm font-medium text-gray-700 mb-1">Vehicle Type *</label>
                <input type="text" name="vehicle_type" id="vehicle_type" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                      value="{% if let Some(ProfessionDetails::Driver(d)) = details %}{{ d.vehicle_type }}{% endif %}">
            </div>
            <div>
                <label for="number_of_accidents" class="block text-sm font-medium text-gray-700 mb-1">Number of Accidents *</label>
                <input type="number" name="number_of_accidents" id="number_of_accidents" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                      value="{% if let Some(ProfessionDetails::Driver(d)) = details %}{{ d.number_of_accidents }}{% else %}0{% endif %}">
            </div>
            
        {% when WorkerProfession::Mason %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">HQ Restoration Skills *</label>
                <div class="flex space-x-4 mt-1">
                    <label class="inline-flex items-center">
                        <input type="radio" name="hq_restoration_skills" value="true"
                              {% if let Some(ProfessionDetails::Mason(m)) = details %}{% if m.hq_restoration_skills %}checked{% endif %}{% endif %}
                              class="h-4 w-4 text-primary focus:ring-primary border-gray-300">
                        <span class="ml-2">Yes</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="hq_restoration_skills" value="false"
                              {% if let Some(ProfessionDetails::Mason(m)) = details %}{% if !m.hq_restoration_skills %}checked{% endif %}{% else %}checked{% endif %}
                              class="h-4 w-4 text-primary focus:ring-primary border-gray-300">
                        <span class="ml-2">No</span>
                    </label>
                </div>
            </div>
    {% endmatch %}
</div>
