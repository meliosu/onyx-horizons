<option value="" disabled {% if selected_id.is_none() %}selected{% endif %}>Select Brigadier</option>
{% for brigadier in brigadiers %}
<option value="{{ brigadier.id }}" {% if let Some(id) = selected_id %}{% if id == brigadier.id %}selected{% endif %}{% endif %}>
    {{ brigadier.name }} ({{ brigadier.profession }})
</option>
{% endfor %}
