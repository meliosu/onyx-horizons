{% if reports|length == 0 %}
<tr>
    <td colspan="4" class="px-6 py-4 text-center">
        <p class="text-gray-500">No reports available for this site</p>
    </td>
</tr>
{% else %}
    {% for report in reports %}
    <tr class="hover:bg-gray-50">
        <td class="px-6 py-4 whitespace-nowrap">
            <span class="font-medium">{{ report.title }}</span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            {{ report.date }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full 
                {% if report.report_type == "progress" %}bg-blue-100 text-blue-800
                {% elif report.report_type == "completion" %}bg-green-100 text-green-800
                {% elif report.report_type == "inspection" %}bg-yellow-100 text-yellow-800
                {% elif report.report_type == "incident" %}bg-red-100 text-red-800
                {% else %}bg-gray-100 text-gray-800{% endif %}">
                {{ report.report_type | capitalize }}
            </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right">
            <div class="flex justify-end space-x-2">
                {% if report.file_url %}
                <a href="{{ report.file_url }}" target="_blank" class="px-2 py-1 text-blue-600 hover:bg-blue-100 rounded">
                    <i class="fas fa-download"></i>
                </a>
                {% endif %}
                <a href="/reports/{{ report.id }}" class="px-2 py-1 text-blue-600 hover:bg-blue-100 rounded">
                    <i class="fas fa-eye"></i>
                </a>
            </div>
        </td>
    </tr>
    {% endfor %}

    <!-- Pagination information for the parent component -->
    <tr class="hidden">
        <td id="pagination-info" data-current-page="{{ current_page }}" data-total-pages="{{ total_pages }}"></td>
    </tr>
{% endif %}
