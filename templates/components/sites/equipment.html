{% if equipment|length == 0 %}
<tr>
    <td colspan="6" class="px-6 py-4 text-center">
        <p class="text-gray-500">No equipment allocated to this site</p>
    </td>
</tr>
{% else %}
    {% for item in equipment %}
    <tr class="hover:bg-gray-50">
        <td class="px-6 py-4 whitespace-nowrap">
            <a href="/equipment/{{ item.equipment_id }}" class="text-blue-600 hover:underline font-medium">
                {{ item.name }}
            </a>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            {{ item.amount }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            {{ item.period_start }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            {{ item.period_end }}
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            {% if item.is_active %}
                <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                    Active
                </span>
            {% else %}
                <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                    Inactive
                </span>
            {% endif %}
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right">
            <div class="flex justify-end space-x-2">
                <button class="px-2 py-1 text-gray-600 hover:bg-gray-100 rounded"
                        hx-get="/api/equipment/allocations/{{ item.equipment_id }}/edit"
                        hx-target="#modal-container">
                    <i class="fas fa-pencil"></i>
                </button>
                <button class="px-2 py-1 text-red-600 hover:bg-red-100 rounded"
                        hx-delete="/api/equipment/allocations/{{ item.equipment_id }}"
                        hx-confirm="Are you sure you want to remove this equipment allocation?"
                        hx-target="closest tr"
                        hx-swap="outerHTML">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </td>
    </tr>
    {% endfor %}

    <!-- Pagination information for the parent component -->
    <tr class="hidden">
        <td id="pagination-info" data-current-page="{{ current_page }}" data-total-pages="{{ total_pages }}"></td>
    </tr>
{% endif %}
