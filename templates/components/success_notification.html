<div class="bg-green-50 border-l-4 border-green-500 p-4 mb-4 rounded-md" role="alert" 
     hx-swap-oob="true" id="notification-area">
    <div class="flex items-center">
        <div class="flex-shrink-0">
            <i class="fas fa-check-circle text-green-500"></i>
        </div>
        <div class="ml-3">
            <p class="text-green-700">{{ message }}</p>
        </div>
        <div class="ml-auto pl-3">
            <div class="flex">
                <button type="button" class="text-green-500 hover:text-green-700 focus:outline-none"
                        onclick="this.parentElement.parentElement.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-hide notification after 5 seconds
        setTimeout(() => {
            const notification = document.getElementById('notification-area');
            if (notification) {
                notification.style.transition = 'opacity 0.5s';
                notification.style.opacity = '0';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 500);
            }
        }, 5000);
    </script>
</div>
