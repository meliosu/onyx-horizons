{% if is_unique %}
    <div class="text-green-500">
        <i class="fas fa-check-circle mr-1"></i> INN is valid
    </div>
{% else %}
    <div class="text-red-500">
        <i class="fas fa-exclamation-circle mr-1"></i> 
        {% if let Some(msg) = message %}
            {{ msg }}
        {% else %}
            INN already exists
        {% endif %}
    </div>
{% endif %}
