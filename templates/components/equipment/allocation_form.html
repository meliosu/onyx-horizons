<form class="p-6 space-y-4" 
      {% if allocation %}
      hx-put="/api/equipment/allocations/{{ allocation.id }}"
      {% else %}
      hx-post="/api/equipment/{{ equipment_id }}/allocations"
      {% endif %}
      hx-target="#allocations-table"
      hx-swap="innerHTML"
      hx-on::after-request="closeAllocationModal()">
    
    <div>
        <label for="department_id" class="block text-sm font-medium text-gray-700 mb-1">Department *</label>
        <select name="department_id" id="department_id" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                hx-get="/api/selectors/sites-by-department" 
                hx-target="#site_id"
                hx-trigger="change">
            <option value="">Select Department</option>
            {% for dept in departments %}
                <option value="{{ dept.id }}" 
                        {% if allocation and allocation.department_id == dept.id %}selected{% endif %}>
                    {{ dept.name }}
                </option>
            {% endfor %}
        </select>
        <div class="validation-message text-xs text-red-500 mt-1"></div>
    </div>
    
    <div>
        <label for="site_id" class="block text-sm font-medium text-gray-700 mb-1">Site (Optional)</label>
        <select name="site_id" id="site_id"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
            <option value="">Department Level (No Site)</option>
            {% for site in sites %}
                <option value="{{ site.id }}" data-department="{{ site.department_id }}"
                        {% if allocation and allocation.site_id == site.id %}selected{% endif %}>
                    {{ site.description }}
                </option>
            {% endfor %}
        </select>
        <div class="validation-message text-xs text-red-500 mt-1"></div>
    </div>
    
    <div>
        <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Amount *</label>
        <input type="number" name="amount" id="amount" min="1" required 
               value="{% if allocation %}{{ allocation.amount }}{% endif %}"
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
        <div class="validation-message text-xs text-red-500 mt-1"></div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="period_start" class="block text-sm font-medium text-gray-700 mb-1">Start Date *</label>
            <input type="date" name="period_start" id="period_start" required
                   value="{% if allocation %}{{ allocation.period_start }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
            <div class="validation-message text-xs text-red-500 mt-1"></div>
        </div>
        
        <div>
            <label for="period_end" class="block text-sm font-medium text-gray-700 mb-1">End Date *</label>
            <input type="date" name="period_end" id="period_end" required
                   value="{% if allocation %}{{ allocation.period_end }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
            <div class="validation-message text-xs text-red-500 mt-1"></div>
        </div>
    </div>
    
    <div class="mt-6 flex justify-end space-x-3">
        <button type="button" onclick="closeAllocationModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
            Cancel
        </button>
        <button type="submit" class="btn-primary px-4 py-2 rounded-md">
            {% if allocation %}
                Update Allocation
            {% else %}
                Create Allocation
            {% endif %}
        </button>
    </div>
</form>
