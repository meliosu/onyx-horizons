<form class="p-6 space-y-4"
      {% if expenditure %}
      hx-put="/api/tasks/{{ task_id }}/materials/{{ material_id }}"
      {% else %}
      hx-post="/api/tasks/{{ task_id }}/materials"
      {% endif %}
      hx-target="#task-materials"
      hx-swap="innerHTML"
      hx-on::after-request="closeMaterialModal()">
    
    {% if not expenditure %}
    <div>
        <label for="material_id" class="block text-sm font-medium text-gray-700 mb-1">Material *</label>
        <select name="material_id" id="material_id" required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
               onchange="updateUnitDisplay(this)">
            <option value="" disabled selected>Select Material</option>
            {% for material in available_materials %}
                <option value="{{ material.id }}" data-unit="{{ material.units }}">{{ material.name }} ({{ material.units }})</option>
            {% endfor %}
        </select>
        <div class="validation-message text-xs text-red-500 mt-1"></div>
    </div>
    {% endif %}
    
    <div>
        <label for="expected_amount" class="block text-sm font-medium text-gray-700 mb-1">Expected Amount *</label>
        <div class="flex">
            <input type="number" name="expected_amount" id="expected_amount" step="0.01" min="0.01" required
                   value="{% if expenditure %}{{ expenditure.expected_amount }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
            <span class="inline-flex items-center px-3 py-2 text-sm text-gray-500 bg-gray-50 border border-l-0 border-gray-300 rounded-r-md">
                <span id="material-unit-1">{{ expenditure.material_units if expenditure else "units" }}</span>
            </span>
        </div>
        <div class="validation-message text-xs text-red-500 mt-1"></div>
    </div>
    
    <div>
        <label for="actual_amount" class="block text-sm font-medium text-gray-700 mb-1">Actual Amount</label>
        <div class="flex">
            <input type="number" name="actual_amount" id="actual_amount" step="0.01" min="0"
                   value="{% if expenditure and expenditure.actual_amount %}{{ expenditure.actual_amount }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
            <span class="inline-flex items-center px-3 py-2 text-sm text-gray-500 bg-gray-50 border border-l-0 border-gray-300 rounded-r-md">
                <span id="material-unit-2">{{ expenditure.material_units if expenditure else "units" }}</span>
            </span>
        </div>
        <p class="text-xs text-gray-500 mt-1">Leave blank if not yet measured</p>
    </div>
    
    <div class="mt-6 flex justify-end space-x-3">
        <button type="button" onclick="closeMaterialModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
            Cancel
        </button>
        <button type="submit" class="btn-primary px-4 py-2 rounded-md">
            {% if expenditure %}
                Update Material
            {% else %}
                Add Material
            {% endif %}
        </button>
    </div>
    
    <script>
        function updateUnitDisplay(select) {
            const selectedOption = select.options[select.selectedIndex];
            const unit = selectedOption.dataset.unit || 'units';
            document.getElementById('material-unit-1').textContent = unit;
            document.getElementById('material-unit-2').textContent = unit;
        }
    </script>
</form>
