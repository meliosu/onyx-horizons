<select name="{{ name }}" id="{{ id }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
        {% if required %}required{% endif %}
        {% if disabled %}disabled{% endif %}>
    {% if let Some(placeholder_text) = placeholder %}
    <option value="" disabled {% if !options.iter().any(|opt| opt.selected) %}selected{% endif %}>{{ placeholder_text }}</option>
    {% endif %}
    {% for option in options %}
    <option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
    {% endfor %}
</select>
<div class="validation-message text-xs text-red-500 mt-1"></div>

{% if let Some(filter) = profession_filter %}
<div class="text-xs text-gray-500 mt-1">
    <i class="fas fa-filter mr-1"></i>Filtered by: {{ filter }}
</div>
{% endif %}
