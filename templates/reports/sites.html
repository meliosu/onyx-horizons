{% extends "general/index.html" %}

{% block title %}Site Reports - Onyx Horizons{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-onyx mb-6">Site Reports</h1>
    
    <div class="bg-white rounded-md shadow-md p-6 mb-6">
        <h2 class="text-lg font-semibold mb-4">Select Site and Report Type</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="site_id" class="block text-sm font-medium text-gray-700 mb-1">Site</label>
                <select id="site_id" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    <option value="">Select a site</option>
                    {% for site in sites %}
                    <option value="{{ site.id }}">{{ site.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="report_type" class="block text-sm font-medium text-gray-700 mb-1">Report Type</label>
                <select id="report_type" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    <option value="schedule">Schedule Report</option>
                    <option value="materials">Materials Report</option>
                    <option value="equipment">Equipment Report</option>
                    <option value="brigades">Brigades Report</option>
                    <option value="construction">Construction Summary Report</option>
                </select>
            </div>
            
            <div id="date-range-container">
                <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                <input type="date" id="start_date" name="start_date" 
                       value="{% if let Some(date) = start_date %}{{ date }}{% endif %}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
            </div>
            
            <div id="end-date-container">
                <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                <input type="date" id="end_date" name="end_date" 
                       value="{% if let Some(date) = end_date %}{{ date }}{% endif %}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
            </div>
        </div>
        
        <div class="mt-6 flex justify-end">
            <button type="button" id="generate-report" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600">
                <i class="fas fa-file-alt mr-1"></i> Generate Report
            </button>
        </div>
    </div>
    
    <div id="report-container" class="bg-white rounded-md shadow-md overflow-hidden">
        <div class="p-6 text-center text-gray-500">
            <p>Select a site and report type, then click "Generate Report" to view the results.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('report_type').addEventListener('change', function() {
        const reportType = this.value;
        const dateRangeContainer = document.getElementById('date-range-container');
        const endDateContainer = document.getElementById('end-date-container');
        
        if (reportType === 'construction') {
            dateRangeContainer.style.display = 'none';
            endDateContainer.style.display = 'none';
        } else {
            dateRangeContainer.style.display = 'block';
            endDateContainer.style.display = 'block';
        }
    });

    document.getElementById('generate-report').addEventListener('click', function() {
        const siteId = document.getElementById('site_id').value;
        const reportType = document.getElementById('report_type').value;
        const startDate = document.getElementById('start_date').value;
        const endDate = document.getElementById('end_date').value;
        
        if (!siteId) {
            alert('Please select a site');
            return;
        }
        
        let url = `/api/reports/sites/${siteId}/${reportType}`;
        
        if (reportType !== 'construction') {
            url += '?';
            
            if (startDate) {
                url += `start_date=${startDate}&`;
            }
            
            if (endDate) {
                url += `end_date=${endDate}&`;
            }
        }
        
        htmx.ajax('GET', url, {target: '#report-container', swap: 'innerHTML'});
    });
</script>
{% endblock %}
