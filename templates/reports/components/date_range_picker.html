<div class="bg-white p-4 rounded-md shadow mb-6">
    <h3 class="font-medium mb-3">Select Date Range</h3>
    <form hx-get="{{ report_endpoint }}" hx-target="#report-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
            <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
            <input type="date" id="start_date" name="start_date" 
                   value="{% if let Some(date) = start_date %}{{ date }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
        </div>
        
        <div>
            <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
            <input type="date" id="end_date" name="end_date" 
                   value="{% if let Some(date) = end_date %}{{ date }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
        </div>
        
        {% if show_extra_filters %}
        <div>
            <label for="filter_by" class="block text-sm font-medium text-gray-700 mb-1">{{ filter_label }}</label>
            <select id="filter_by" name="{{ filter_name }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                <option value="">All</option>
                {% for option in filter_options %}
                <option value="{{ option.value }}">{{ option.label }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        
        <div class="flex items-end">
            <button type="submit" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600 w-full md:w-auto">
                <i class="fas fa-filter mr-1"></i> Apply Filters
            </button>
        </div>
        
        <input type="hidden" name="id" value="{{ entity_id }}">
        <input type="hidden" name="page" value="1">
    </form>
</div>
