{% extends "index.html" %}

{% block title %}New Equipment - Onyx Horizons{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="/equipment" class="text-amber hover:underline">
            <i class="fas fa-arrow-left mr-2"></i> Back to Equipment
        </a>
    </div>
    
    <div class="bg-white p-6 rounded-md shadow-md">
        <h1 class="text-2xl font-bold mb-6">Add New Equipment</h1>
        
        <div id="notification-area"></div>
        
        <form hx-post="/api/equipment" hx-target="#notification-area" hx-indicator="#form-loading">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Equipment Name <span class="text-red-500">*</span></label>
                    <input type="text" id="name" name="name" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Amount <span class="text-red-500">*</span></label>
                    <input type="number" id="amount" name="amount" min="1" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                <div>
                    <label for="purchase_date" class="block text-sm font-medium text-gray-700 mb-1">Purchase Date <span class="text-red-500">*</span></label>
                    <input type="date" id="purchase_date" name="purchase_date" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                <div>
                    <label for="purchase_cost" class="block text-sm font-medium text-gray-700 mb-1">Purchase Cost ($) <span class="text-red-500">*</span></label>
                    <input type="number" id="purchase_cost" name="purchase_cost" min="0" step="0.01" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                <div>
                    <label for="fuel_type" class="block text-sm font-medium text-gray-700 mb-1">Fuel Type</label>
                    <select id="fuel_type" name="fuel_type"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                        <option value="none">None</option>
                        <option value="diesel">Diesel</option>
                        <option value="petrol">Petrol</option>
                        <option value="electric">Electric</option>
                        <option value="gas">Gas</option>
                    </select>
                </div>
            </div>
            
            <div class="flex justify-end">
                <button type="button" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 mr-2"
                        onclick="window.location.href='/equipment'">
                    Cancel
                </button>
                <button type="submit" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600">
                    <i class="fas fa-save mr-1"></i> Save Equipment
                </button>
            </div>
            
            <div id="form-loading" class="htmx-indicator flex justify-center py-4 mt-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
