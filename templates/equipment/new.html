{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Add New Equipment</h1>
        <p class="text-gray-600">Complete the form below to add new equipment to inventory</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-post="/api/equipment" hx-swap="outerHTML" class="equipment-form">
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Equipment Name *</label>
                        <input type="text" name="name" id="name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Total Amount *</label>
                        <input type="number" name="amount" id="amount" min="1" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="purchase_date" class="block text-sm font-medium text-gray-700 mb-1">Purchase Date *</label>
                        <input type="date" name="purchase_date" id="purchase_date" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="purchase_cost" class="block text-sm font-medium text-gray-700 mb-1">Purchase Cost *</label>
                        <input type="number" name="purchase_cost" id="purchase_cost" step="0.01" min="0" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="fuel_type" class="block text-sm font-medium text-gray-700 mb-1">Fuel Type</label>
                        <select name="fuel_type" id="fuel_type"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <option value="none">None</option>
                            <option value="diesel">Diesel</option>
                            <option value="petrol">Petrol</option>
                            <option value="electric">Electric</option>
                            <option value="gas">Gas</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/equipment" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Add Equipment
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
