{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Edit Equipment</h1>
        <p class="text-gray-600">Update equipment information</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-put="/api/equipment/{{ equipment.id }}" hx-swap="outerHTML" class="equipment-form">
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Equipment Name *</label>
                        <input type="text" name="name" id="name" required value="{{ equipment.name }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Total Amount *</label>
                        <input type="number" name="amount" id="amount" min="1" required value="{{ equipment.amount }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="purchase_date" class="block text-sm font-medium text-gray-700 mb-1">Purchase Date *</label>
                        <input type="date" name="purchase_date" id="purchase_date" required value="{{ equipment.purchase_date }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="purchase_cost" class="block text-sm font-medium text-gray-700 mb-1">Purchase Cost *</label>
                        <input type="number" name="purchase_cost" id="purchase_cost" step="0.01" min="0" required value="{{ equipment.purchase_cost }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="fuel_type" class="block text-sm font-medium text-gray-700 mb-1">Fuel Type</label>
                        <select name="fuel_type" id="fuel_type"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <option value="none" {% if not equipment.fuel_type.is_none_or(|ty| ty == FuelType::None) %}selected{% endif %}>None</option>
                            <option value="diesel" {% if equipment.fuel_type.is_some_and(|ty| ty == FuelType::Diesel) %}selected{% endif %}>Diesel</option>
                            <option value="petrol" {% if equipment.fuel_type.is_some_and(|ty| ty == FuelType::Petrol) %}selected{% endif %}>Petrol</option>
                            <option value="electric" {% if equipment.fuel_type.is_some_and(|ty| ty == FuelType::Electric) %}selected{% endif %}>Electric</option>
                            <option value="gas" {% if equipment.fuel_type.is_some_and(|ty| ty == FuelType::Gas) %}selected{% endif %}>Gas</option>
                        </select>
                    </div>
                </div>

                <!-- Additional information here -->
                <div class="border-t border-gray-200 pt-6">
                    <p class="text-sm text-gray-500">
                        <strong>Note:</strong> Changing the amount may affect existing allocations if the new amount is less than what is currently allocated.
                    </p>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/equipment/{{ equipment.id }}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
