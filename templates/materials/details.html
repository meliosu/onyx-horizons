{% extends "general/index.html" %}

{% block title %}{{ material.name }} - Material Details - Onyx Horizons{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="/materials" class="text-amber hover:underline">
            <i class="fas fa-arrow-left mr-2"></i> Back to Materials
        </a>
    </div>
    
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-onyx">{{ material.name }}</h1>
        <div class="flex space-x-2">
            <a href="/materials/{{ material.id }}/edit" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600">
                <i class="fas fa-edit mr-1"></i> Edit
            </a>
            <button class="bg-red-500 text-white py-2 px-4 rounded-md hover:bg-red-600"
                    hx-delete="/api/materials/{{ material.id }}" 
                    hx-confirm="Are you sure you want to delete this material? This may impact tasks using it."
                    hx-target="#notification-area"
                    hx-push-url="/materials">
                <i class="fas fa-trash mr-1"></i> Delete
            </button>
        </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Material Information Card -->
        <div class="bg-white rounded-md shadow-md overflow-hidden">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-onyx">Material Information</h2>
            </div>
            <div class="p-6" id="material-details" hx-get="/api/materials/{{ material.id }}" hx-trigger="load">
                <div class="flex justify-center py-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
                </div>
            </div>
        </div>
        
        <!-- Usage History -->
        <div class="bg-white rounded-md shadow-md overflow-hidden lg:col-span-2">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-onyx">Usage History</h2>
            </div>
            <div id="material-usage" class="p-6" hx-get="/api/materials/{{ material.id }}/usage" hx-trigger="load">
                <div class="flex justify-center py-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification-area" class="mt-6"></div>
</div>
{% endblock %}
