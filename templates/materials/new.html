{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Add New Material</h1>
        <p class="text-gray-600">Define a new construction material</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-post="/api/materials" hx-swap="outerHTML" class="material-form">
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Material Name *</label>
                        <input type="text" name="name" id="name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="cost" class="block text-sm font-medium text-gray-700 mb-1">Cost Per Unit *</label>
                        <div class="relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">$</span>
                            </div>
                            <input type="number" name="cost" id="cost" step="0.01" min="0" required
                                  placeholder="0.00"
                                  class="w-full pl-7 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="units" class="block text-sm font-medium text-gray-700 mb-1">Unit of Measurement *</label>
                        <input type="text" name="units" id="units" required placeholder="e.g., kg, liter, m³"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/materials" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Add Material
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
