{% extends "general/index.html" %}

{% block title %}New Material - Onyx Horizons{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="/materials" class="text-amber hover:underline">
            <i class="fas fa-arrow-left mr-2"></i> Back to Materials
        </a>
    </div>
    
    <div class="bg-white p-6 rounded-md shadow-md">
        <h1 class="text-2xl font-bold mb-6">Add New Material</h1>
        
        <div id="notification-area"></div>
        
        <form hx-post="/api/materials" hx-target="#notification-area" hx-indicator="#form-loading">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Material Name <span class="text-red-500">*</span></label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                
                <div>
                    <label for="units" class="block text-sm font-medium text-gray-700 mb-1">Units of Measurement <span class="text-red-500">*</span></label>
                    <input type="text" id="units" name="units" required placeholder="e.g., kg, m³, piece"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                
                <div>
                    <label for="cost" class="block text-sm font-medium text-gray-700 mb-1">Cost per Unit <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">$</span>
                        </div>
                        <input type="number" id="cost" name="cost" required min="0.01" step="0.01"
                            class="w-full pl-7 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end">
                <button type="button" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 mr-2"
                        onclick="window.location.href='/materials'">
                    Cancel
                </button>
                <button type="submit" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600">
                    <i class="fas fa-save mr-1"></i> Save Material
                </button>
            </div>
            
            <div id="form-loading" class="htmx-indicator flex justify-center py-4 mt-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
