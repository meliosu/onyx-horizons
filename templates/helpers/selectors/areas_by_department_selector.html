<div class="selector-container {% if let Some(_) = search_term %}with-search{% endif %}" id="areas-for-department-{{ department_id }}">
    {% if let Some(label_text) = label %}
    <label for="{{ id }}" class="block text-sm font-medium text-gray-700 mb-1">{{ label_text }}{% if required %}<span class="text-red-500">*</span>{% endif %}</label>
    {% endif %}
    
    {% if let Some(_) = search_term %}
    <div class="relative">
        <input
            type="text"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber mb-2"
            placeholder="Search areas..."
            hx-get="/api/selectors/areas-by-department/{{ department_id }}"
            hx-trigger="keyup changed delay:300ms"
            hx-target="closest div.selector-container"
            hx-include="[name='{{ name }}']"
            value="{{ search_term.clone().unwrap_or_default() }}"
            name="search">
    </div>
    {% endif %}
    
    <select
        id="{{ id }}"
        name="{{ name }}"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber"
        {% if required %}required{% endif %}>
        
        {% if let Some(text) = placeholder %}
        <option value="">{{ text }}</option>
        {% endif %}
        
        {% if options.len() == 0 %}
        <option value="" disabled>No areas found for this department</option>
        {% else %}
            {% for option in options %}
            <option 
                value="{{ option.value }}" 
                {% if option.selected %}selected{% endif %}
                {% if let Some(attrs) = option.data_attributes %}
                    {% for (name, value) in attrs %}
                        data-{{ name }}="{{ value }}"
                    {% endfor %}
                {% endif %}>
                {{ option.label }}
            </option>
            {% endfor %}
        {% endif %}
    </select>
</div>
