{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Create New Task</h1>
        <p class="text-gray-600">Define a new task for a construction site</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-post="/api/tasks" hx-swap="outerHTML" class="task-form">
            <div class="p-6 space-y-6">
                <!-- Basic Task Information -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Task Name *</label>
                        <input type="text" name="name" id="name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="site_id" class="block text-sm font-medium text-gray-700 mb-1">Site *</label>
                        <select name="site_id" id="site_id" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <option value="" disabled selected>Select Site</option>
                            {% for site in sites %}
                            <option value="{{ site.id }}">{{ site.description.unwrap_or_default() }}</option>
                            {% endfor %}
                        </select>
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="brigade_id" class="block text-sm font-medium text-gray-700 mb-1">Brigade</label>
                        <select name="brigade_id" id="brigade_id"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <option value="">No Brigade Assigned</option>
                            {% for brigade in brigades %}
                            <option value="{{ brigade.id }}">Brigade #{{ brigade.id }} - {{ brigade.brigadier_name.unwrap_or("No Brigadier".into()) }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea name="description" id="description" rows="3"
                                 class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"></textarea>
                    </div>
                </div>

                <!-- Time Period -->
                <div class="border-t border-gray-200 pt-6">
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Time Period</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="period_start" class="block text-sm font-medium text-gray-700 mb-1">Start Date *</label>
                            <input type="date" name="period_start" id="period_start" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        
                        <div>
                            <label for="expected_period_end" class="block text-sm font-medium text-gray-700 mb-1">Expected End Date *</label>
                            <input type="date" name="expected_period_end" id="expected_period_end" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                    </div>
                </div>

                <!-- Material Requirements -->
                <div class="border-t border-gray-200 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-medium text-gray-900">Material Requirements</h2>
                        <button type="button" id="add-material-btn" class="text-sm text-blue-600 hover:text-blue-800">
                            <i class="fas fa-plus mr-1"></i> Add Material
                        </button>
                    </div>
                    
                    <div id="materials-container" class="space-y-4">
                        <!-- Material rows will be added here -->
                        <p class="text-sm text-gray-500 italic">You can add materials after creating the task</p>
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/tasks" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>

<template id="material-row-template">
    <div class="material-row grid grid-cols-12 gap-2 items-center">
        <div class="col-span-6">
            <select name="materials[][id]" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                <option value="" disabled selected>Select Material</option>
                {% for material in materials %}
                <option value="{{ material.id }}">{{ material.name }} ({{ material.units }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-span-5">
            <div class="flex items-center">
                <input type="number" name="materials[][expected_amount]" step="0.01" min="0.01" required placeholder="Amount" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                <span class="material-unit ml-2 text-sm text-gray-500"></span>
            </div>
        </div>
        <div class="col-span-1 text-center">
            <button type="button" class="remove-material text-red-500 hover:text-red-700">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>
</template>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const addMaterialBtn = document.getElementById('add-material-btn');
        const materialsContainer = document.getElementById('materials-container');
        const template = document.getElementById('material-row-template');
        
        if (addMaterialBtn && materialsContainer && template) {
            addMaterialBtn.addEventListener('click', function() {
                const materialRow = template.content.cloneNode(true);
                
                // Clear any existing text
                if (materialsContainer.querySelector('.italic')) {
                    materialsContainer.innerHTML = '';
                }
                
                // Add event listener to remove button
                const removeBtn = materialRow.querySelector('.remove-material');
                if (removeBtn) {
                    removeBtn.addEventListener('click', function() {
                        this.closest('.material-row').remove();
                        
                        // If no rows left, show the default text
                        if (materialsContainer.querySelectorAll('.material-row').length === 0) {
                            materialsContainer.innerHTML = '<p class="text-sm text-gray-500 italic">You can add materials after creating the task</p>';
                        }
                    });
                }
                
                // Add unit updating
                const materialSelect = materialRow.querySelector('select');
                const unitSpan = materialRow.querySelector('.material-unit');
                if (materialSelect && unitSpan) {
                    materialSelect.addEventListener('change', function() {
                        const selectedOption = this.options[this.selectedIndex];
                        const materialText = selectedOption.textContent;
                        const unitMatch = materialText.match(/\(([^)]+)\)$/);
                        if (unitMatch && unitMatch[1]) {
                            unitSpan.textContent = unitMatch[1];
                        }
                    });
                }
                
                materialsContainer.appendChild(materialRow);
            });
        }
    });
</script>
{% endblock %}
