{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Edit Task</h1>
        <p class="text-gray-600">Update task information</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-put="/api/tasks/{{ task.id }}" hx-swap="outerHTML" class="task-form">
            <div class="p-6 space-y-6">
                <!-- Basic Task Information -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Task Name *</label>
                        <input type="text" name="name" id="name" required value="{{ task.name }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="site_id" class="block text-sm font-medium text-gray-700 mb-1">Site *</label>
                        <select name="site_id" id="site_id" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            {% for site in sites %}
                            <option value="{{ site.id }}" {% if task.site_id == site.id %}selected{% endif %}>
                                {{ site.description }}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="validation-message text-xs text-red-500 mt-1"></div>
                    </div>
                    
                    <div>
                        <label for="brigade_id" class="block text-sm font-medium text-gray-700 mb-1">Brigade</label>
                        <select name="brigade_id" id="brigade_id"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <option value="">No Brigade Assigned</option>
                            {% for brigade in brigades %}
                            <option value="{{ brigade.id }}" {% if task.brigade_id == brigade.id %}selected{% endif %}>
                                Brigade #{{ brigade.id }} - {{ brigade.brigadier_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea name="description" id="description" rows="3"
                                 class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">{{ task.description }}</textarea>
                    </div>
                </div>

                <!-- Time Period -->
                <div class="border-t border-gray-200 pt-6">
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Time Period</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="period_start" class="block text-sm font-medium text-gray-700 mb-1">Start Date *</label>
                            <input type="date" name="period_start" id="period_start" required value="{{ task.period_start }}"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        
                        <div>
                            <label for="expected_period_end" class="block text-sm font-medium text-gray-700 mb-1">Expected End Date *</label>
                            <input type="date" name="expected_period_end" id="expected_period_end" required value="{{ task.expected_period_end }}"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>

                        {% if task.is_completed %}
                        <div>
                            <label for="actual_period_end" class="block text-sm font-medium text-gray-700 mb-1">Actual End Date</label>
                            <input type="date" id="actual_period_end" disabled value="{{ task.actual_period_end }}"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-50">
                            <p class="text-xs text-gray-500 mt-1">This task has already been marked as complete</p>
                        </div>
                        {% endif %}
                    </div>
                </div>

                <!-- Material Requirements Note -->
                <div class="border-t border-gray-200 pt-6">
                    <p class="text-sm text-gray-500">
                        <strong>Note:</strong> Materials can be managed from the task details page after saving.
                    </p>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/tasks/{{ task.id }}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
