<div class="bg-white p-6 rounded-md shadow-md">
    <h3 class="text-lg font-semibold mb-4">Mark Task as Complete</h3>
    <form hx-put="/api/tasks/{{ task_id }}/complete" hx-target="#notification-area" hx-indicator="#complete-loading">
        <div class="mb-4">
            <label for="actual_period_end" class="block text-sm font-medium text-gray-700 mb-1">Actual Completion Date <span class="text-red-500">*</span></label>
            <input type="date" id="actual_period_end" name="actual_period_end" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
            <p class="text-sm text-gray-500 mt-1">Enter the date when this task was actually completed.</p>
        </div>
        
        <div class="flex justify-end space-x-3">
            <button type="button" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300"
                    onclick="document.getElementById('complete-task-form').classList.add('hidden')">
                Cancel
            </button>
            <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600">
                <i class="fas fa-check-circle mr-1"></i> Mark as Complete
            </button>
        </div>
        
        <div id="complete-loading" class="htmx-indicator flex justify-center mt-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
        </div>
    </form>
</div>
