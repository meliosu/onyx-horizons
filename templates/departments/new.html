{% extends "general/index.html" %}

{% block title %}New Department - Onyx Horizons{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/departments" class="text-amber hover:underline">
        <i class="fas fa-arrow-left mr-2"></i> Back to Departments
    </a>
</div>

<div class="bg-white p-6 rounded-md shadow-md">
    <h1 class="text-2xl font-bold mb-6">Create New Department</h1>

    <div id="notification-area"></div>

    <form hx-post="/api/departments" hx-target="#notification-area" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Department Name <span class="text-red-500">*</span></label>
            <input type="text" id="name" name="name" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
        </div>

        <div>
            <label for="supervisor_id" class="block text-sm font-medium text-gray-700 mb-1">Supervisor</label>
            <select id="supervisor_id" name="supervisor_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                <option value="">Select a supervisor (optional)</option>
                {% for supervisor in supervisors %}
                <option value="{{ supervisor.id }}">{{ supervisor.name }} ({{ supervisor.qualification }}{% if let Some(position) = supervisor.position %}, {{ position }}{% endif %})</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex justify-end">
            <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 mr-2"
                    onclick="window.location.href='/departments'">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-amber text-onyx rounded-md hover:bg-yellow-600">
                Create Department
            </button>
        </div>
    </form>
</div>
{% endblock %}
