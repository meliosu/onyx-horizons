<div class="bg-white rounded-md shadow-md overflow-hidden">
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-onyx">Client Information</h2>
    </div>
    <div class="p-6">
        <div class="space-y-4">
            <div>
                <p class="text-sm text-gray-500">Company Name</p>
                <p class="font-medium">{{ client.name }}</p>
            </div>
            
            <div>
                <p class="text-sm text-gray-500">INN</p>
                <p>{{ client.inn }}</p>
            </div>
            
            <div>
                <p class="text-sm text-gray-500">Address</p>
                <p>{{ client.address }}</p>
            </div>
            
            <div>
                <p class="text-sm text-gray-500">Contact Person</p>
                <p>{{ client.contact_person_name }}</p>
            </div>
            
            <div>
                <p class="text-sm text-gray-500">Contact Email</p>
                <p>{{ client.contact_person_email }}</p>
            </div>
            
            <div>
                <p class="text-sm text-gray-500">Status</p>
                <p>
                    {% if client.is_vip %}
                    <span class="bg-amber text-onyx py-1 px-2 rounded-full text-xs">VIP Client</span>
                    {% else %}
                    <span class="bg-gray-100 text-gray-600 py-1 px-2 rounded-full text-xs">Standard Client</span>
                    {% endif %}
                </p>
            </div>
        </div>
    </div>
</div>
