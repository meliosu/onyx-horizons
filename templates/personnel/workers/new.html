{% extends "general/index.html" %}

{% block title %}New Worker - Onyx Horizons{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="/personnel/workers" class="text-amber hover:underline">
            <i class="fas fa-arrow-left mr-2"></i> Back to Workers
        </a>
    </div>
    
    <div class="bg-white p-6 rounded-md shadow-md">
        <h1 class="text-2xl font-bold mb-6">Create Worker</h1>
        
        <div id="notification-area"></div>
        
        <form hx-post="/api/personnel/workers" hx-target="#notification-area" hx-indicator="#form-loading">
            <!-- Personal Information -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-4">Personal Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
                        <input type="text" id="first_name" name="employee.first_name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name <span class="text-red-500">*</span></label>
                        <input type="text" id="last_name" name="employee.last_name" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                    <div>
                        <label for="middle_name" class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
                        <input type="text" id="middle_name" name="employee.middle_name"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                    <div>
                        <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender <span class="text-red-500">*</span></label>
                        <select id="gender" name="employee.gender" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div>
                        <label for="phone_number" class="block text-sm font-medium text-gray-700 mb-1">Phone Number <span class="text-red-500">*</span></label>
                        <input type="tel" id="phone_number" name="employee.phone_number" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                    <div>
                        <label for="salary" class="block text-sm font-medium text-gray-700 mb-1">Salary <span class="text-red-500">*</span></label>
                        <input type="number" id="salary" name="employee.salary" min="0" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                    <div>
                        <label for="photo" class="block text-sm font-medium text-gray-700 mb-1">Photo URL</label>
                        <input type="url" id="photo" name="employee.photo"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                </div>
            </div>
            
            <!-- Professional Information -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-4">Professional Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="profession" class="block text-sm font-medium text-gray-700 mb-1">Profession <span class="text-red-500">*</span></label>
                        <select id="profession" name="profession" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber"
                               hx-get="/api/personnel/workers/type-fields" 
                               hx-target="#profession-fields"
                               hx-trigger="change">
                            <option value="">Select profession</option>
                            <option value="electrician">Electrician</option>
                            <option value="plumber">Plumber</option>
                            <option value="welder">Welder</option>
                            <option value="driver">Driver</option>
                            <option value="mason">Mason</option>
                        </select>
                    </div>
                    <div>
                        <label for="union_name" class="block text-sm font-medium text-gray-700 mb-1">Union Name</label>
                        <input type="text" id="union_name" name="union_name"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    </div>
                    <div>
                        <label for="brigade_id" class="block text-sm font-medium text-gray-700 mb-1">Brigade Assignment</label>
                        <select id="brigade_id" name="brigade_id" 
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                            <option value="">Not Assigned</option>
                            {% for brigade in brigades %}
                            <option value="{{ brigade.id }}">
                                {% if let Some(brigadier_name) = brigade.brigadier_name %}
                                    Brigade #{{ brigade.id }} ({{ brigadier_name }})
                                {% else %}
                                    Brigade #{{ brigade.id }}
                                {% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="is_brigadier" name="is_brigadier" class="h-4 w-4 text-amber focus:ring-amber border-gray-300 rounded">
                        <label for="is_brigadier" class="ml-2 block text-sm text-gray-900">Assign as Brigadier</label>
                    </div>
                </div>
            </div>
            
            <!-- Profession-specific fields -->
            <div id="profession-fields" class="mb-6">
                <!-- This section will be dynamically loaded based on profession selection -->
                <div class="bg-gray-50 p-4 rounded-md">
                    <p class="text-gray-500 text-center">Please select a profession to see specific fields</p>
                </div>
            </div>
            
            <div class="flex justify-end">
                <button type="button" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 mr-2"
                        onclick="window.location.href='/personnel/workers'">
                    Cancel
                </button>
                <button type="submit" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600">
                    Save New Worker
                </button>
            </div>
            
            <div id="form-loading" class="htmx-indicator flex justify-center py-4 mt-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
