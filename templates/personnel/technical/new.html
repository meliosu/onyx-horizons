{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Add New Technical Personnel</h1>
        <p class="text-gray-600">Complete the form below to add a new technical staff member</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-post="/api/personnel/technical" hx-swap="outerHTML">
            <div class="p-6 space-y-6">
                <!-- Personal Information -->
                <div class="border-b border-gray-200 pb-6">
                    <h2 class="text-lg font-medium mb-4">Personal Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div>
                            <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
                            <input type="text" name="employee.first_name" id="first_name" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
                            <input type="text" name="employee.last_name" id="last_name" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="middle_name" class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
                            <input type="text" name="employee.middle_name" id="middle_name"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
                            <div class="flex space-x-4 mt-1">
                                <label class="inline-flex items-center">
                                    <input type="radio" name="employee.gender" value="male" checked
                                          class="h-4 w-4 text-primary focus:ring-primary border-gray-300">
                                    <span class="ml-2">Male</span>
                                </label>
                                <label class="inline-flex items-center">
                                    <input type="radio" name="employee.gender" value="female"
                                          class="h-4 w-4 text-primary focus:ring-primary border-gray-300">
                                    <span class="ml-2">Female</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label for="phone_number" class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                            <input type="tel" name="employee.phone_number" id="phone_number" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="salary" class="block text-sm font-medium text-gray-700 mb-1">Salary *</label>
                            <input type="number" name="employee.salary" id="salary" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="photo" class="block text-sm font-medium text-gray-700 mb-1">Photo URL</label>
                            <input type="text" name="employee.photo" id="photo"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                    </div>
                </div>

                <!-- Professional Information -->
                <div class="border-b border-gray-200 pb-6">
                    <h2 class="text-lg font-medium mb-4">Professional Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="qualification" class="block text-sm font-medium text-gray-700 mb-1">Qualification *</label>
                            <select name="qualification" id="qualification" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                                   hx-get="/api/personnel/technical/qualifications" hx-target="#qualification-fields" hx-trigger="change">
                                <option value="">Select Qualification</option>
                                <option value="technician">Technician</option>
                                <option value="technologist">Technologist</option>
                                <option value="engineer">Engineer</option>
                            </select>
                        </div>
                        <div>
                            <label for="position" class="block text-sm font-medium text-gray-700 mb-1">Position</label>
                            <select name="position" id="position"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <option value="none">No Position</option>
                                <option value="master">Master</option>
                                <option value="foreman">Foreman</option>
                            </select>
                        </div>
                        <div>
                            <label for="education_level" class="block text-sm font-medium text-gray-700 mb-1">Education Level *</label>
                            <input type="text" name="education_level" id="education_level" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label for="is_project_manager" class="flex items-center mb-1">
                                <input type="checkbox" name="is_project_manager" id="is_project_manager" value="true"
                                      class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                                <span class="ml-2 text-sm font-medium text-gray-700">Project Manager</span>
                            </label>
                        </div>
                        <div>
                            <label for="software_skills" class="block text-sm font-medium text-gray-700 mb-1">Software Skills (comma separated)</label>
                            <input type="text" name="software_skills" id="software_skills"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                                  placeholder="AutoCAD, MS Project, Revit">
                        </div>
                        <div>
                            <label for="department_id" class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                            <select name="department_id" id="department_id"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                                   hx-get="/api/selectors/areas-by-department" hx-target="#area_id" hx-trigger="change">
                                <option value="">Select Department</option>
                                {% for department in departments %}
                                <option value="{{ department.id }}">{{ department.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="area_id" class="block text-sm font-medium text-gray-700 mb-1">Area</label>
                            <select name="area_id" id="area_id"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <option value="">Select Area</option>
                                {% for area in areas %}
                                <option value="{{ area.id }}" data-department="{{ area.department_id }}">{{ area.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Qualification-specific Fields -->
                <div id="qualification-fields" class="pb-6">
                    <p class="text-sm text-gray-500">Select a qualification to display additional fields</p>
                </div>
            </div>

            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/personnel/technical" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Create Technical Personnel
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
