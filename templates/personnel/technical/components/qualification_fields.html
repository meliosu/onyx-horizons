<h3 class="text-lg font-semibold mb-4">{{ qualification }} Specific Information</h3>
<div class="p-4 border border-amber rounded-md bg-amber-50 mb-6">
    {% match qualification %}
        {% when Qualification::Technician %}
            <div>
                <label for="safety_training_level" class="block text-sm font-medium text-gray-700 mb-1">Safety Training Level <span class="text-red-500">*</span></label>
                <input type="text" id="safety_training_level" name="safety_training_level" 
                       value="{% if let Some(technician) = technician %}{{ technician.safety_training_level }}{% endif %}" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
            </div>
        {% when Qualification::Technologist %}
            <div>
                <label for="management_tools" class="block text-sm font-medium text-gray-700 mb-1">Management Tools (comma-separated) <span class="text-red-500">*</span></label>
                <input type="text" id="management_tools" name="management_tools" 
                       value="{% if let Some(technologist) = technologist %}{{ technologist.management_tools|join(", ") }}{% endif %}" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber"
                       placeholder="Tool 1, Tool 2, Tool 3">
                <p class="text-xs text-gray-500 mt-1">Enter the management tools separated by commas</p>
            </div>
        {% when Qualification::Engineer %}
            <div>
                <label for="pe_license_id" class="block text-sm font-medium text-gray-700 mb-1">PE License ID <span class="text-red-500">*</span></label>
                <input type="number" id="pe_license_id" name="pe_license_id" 
                       value="{% if let Some(engineer) = engineer %}{{ engineer.pe_license_id }}{% endif %}" required min="1"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
            </div>
    {% endmatch %}
</div>
