{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Edit Brigade #{{ brigade.id }}</h1>
        <p class="text-gray-600">Update brigade information</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-put="/api/brigades/{{ brigade.id }}" hx-swap="outerHTML" class="brigade-form">
            <div class="p-6 space-y-6">
                <!-- Brigadier Selection -->
                <div>
                    <label for="brigadier_id" class="block text-lg font-medium text-gray-700 mb-2">Brigadier *</label>
                    <p class="text-sm text-gray-500 mb-4">Choose a worker to be the brigadier for this brigade.</p>
                    
                    <select name="brigadier_id" id="brigadier_id" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                        {% for brigadier in brigadiers %}
                        <option value="{{ brigadier.id }}" {% if brigade.brigadier_id == brigadier.id %}selected{% endif %}>
                            {{ brigadier.name }} ({{ brigadier.profession }})
                        </option>
                        {% endfor %}
                    </select>
                    <div class="validation-message text-xs text-red-500 mt-1"></div>
                </div>

                <div class="border-t border-gray-200 pt-6">
                    <p class="text-sm text-gray-500">
                        <strong>Note:</strong> To manage workers in this brigade, please use the Brigade Details page.
                    </p>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/brigades/{{ brigade.id }}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
