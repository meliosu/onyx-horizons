{% extends "general/index.html" %}

{% block title %}New Site - Onyx Horizons{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/sites" class="text-amber hover:underline">
        <i class="fas fa-arrow-left mr-2"></i> Back to Sites
    </a>
</div>

<div class="bg-white p-6 rounded-md shadow-md">
    <h1 class="text-2xl font-bold mb-6">Create New Site</h1>
    
    <div id="notification-area"></div>
    
    <form hx-post="/api/sites" hx-target="#notification-area" hx-indicator="#form-loading">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Site Name <span class="text-red-500">*</span></label>
                <input type="text" id="name" name="name" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
            </div>
            
            <div>
                <label for="site_type" class="block text-sm font-medium text-gray-700 mb-1">Site Type <span class="text-red-500">*</span></label>
                <select id="site_type" name="site_type" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber"
                       hx-get="/api/sites/type-fields" hx-target="#type-specific-fields" hx-swap="innerHTML">
                    <option value="" selected disabled>Select site type</option>
                    <option value="power_plant">Power Plant</option>
                    <option value="road">Road</option>
                    <option value="housing">Housing</option>
                    <option value="bridge">Bridge</option>
                    <option value="park">Park</option>
                </select>
            </div>
            
            <div>
                <label for="area_id" class="block text-sm font-medium text-gray-700 mb-1">Area <span class="text-red-500">*</span></label>
                <select id="area_id" name="area_id" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    <option value="" selected disabled>Select area</option>
                    {% for area in areas %}
                    <option value="{{ area.id }}" {% if area_id == Some(*area.id) %}selected{% endif %}>
                        {{ area.name }}
                        {% if let Some(dept_name) = area.department_name %}({{ dept_name }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="client_id" class="block text-sm font-medium text-gray-700 mb-1">Client <span class="text-red-500">*</span></label>
                <select id="client_id" name="client_id" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    <option value="" selected disabled>Select client</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}">{{ client.name }} ({{ client.inn }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="risk_level" class="block text-sm font-medium text-gray-700 mb-1">Risk Level <span class="text-red-500">*</span></label>
                <select id="risk_level" name="risk_level" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                    <option value="" selected disabled>Select risk level</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="description" name="description" rows="3"
                         class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber"></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="latitude" class="block text-sm font-medium text-gray-700 mb-1">Latitude <span class="text-red-500">*</span></label>
                    <input type="number" id="latitude" name="latitude" step="0.000001" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
                <div>
                    <label for="longitude" class="block text-sm font-medium text-gray-700 mb-1">Longitude <span class="text-red-500">*</span></label>
                    <input type="number" id="longitude" name="longitude" step="0.000001" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
                </div>
            </div>
        </div>
        
        <!-- Type-specific fields will be loaded here -->
        <div id="type-specific-fields" class="mb-6"></div>
        
        <div class="flex justify-end">
            <button type="button" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 mr-2"
                    onclick="window.location.href='/sites'">
                Cancel
            </button>
            <button type="submit" class="bg-amber text-onyx py-2 px-4 rounded-md hover:bg-yellow-600">
                Create Site
            </button>
        </div>
        
        <div id="form-loading" class="htmx-indicator flex justify-center py-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber"></div>
        </div>
    </form>
</div>
{% endblock %}
