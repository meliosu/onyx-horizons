{% extends "index.html" %}

{% block content %}
<div class="py-8 px-8 ml-64">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Create New Site</h1>
        <p class="text-gray-600">Complete the form below to create a new construction site</p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <form hx-post="/api/sites" hx-swap="outerHTML">
            <div class="p-6 space-y-6">
                <!-- Basic Site Information -->
                <div class="border-b border-gray-200 pb-6">
                    <h2 class="text-lg font-medium mb-4">Basic Site Information</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="site_type" class="block text-sm font-medium text-gray-700 mb-1">Site Type *</label>
                            <select name="site_type" id="site_type" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
                                    hx-get="/api/sites/type-fields" hx-target="#type-specific-fields" hx-trigger="change">
                                <option value="">Select Site Type</option>
                                <option value="power_plant">Power Plant</option>
                                <option value="road">Road</option>
                                <option value="housing">Housing</option>
                                <option value="bridge">Bridge</option>
                                <option value="park">Park</option>
                            </select>
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                            <input type="text" name="description" id="description" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        <div>
                            <label for="area_id" class="block text-sm font-medium text-gray-700 mb-1">Construction Area *</label>
                            <select name="area_id" id="area_id" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <option value="">Select Area</option>
                                {% for area in areas %}
                                    <option value="{{ area.id }}">{{ area.name }}</option>
                                {% endfor %}
                            </select>
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        <div>
                            <label for="client_id" class="block text-sm font-medium text-gray-700 mb-1">Client *</label>
                            <select name="client_id" id="client_id" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <option value="">Select Client</option>
                                {% for client in clients %}
                                    <option value="{{ client.id }}">{{ client.name }}</option>
                                {% endfor %}
                            </select>
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        <div>
                            <label for="risk_level" class="block text-sm font-medium text-gray-700 mb-1">Risk Level *</label>
                            <select name="risk_level" id="risk_level" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <option value="">Select Risk Level</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Location *</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <input type="text" name="latitude" placeholder="Latitude" required
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                </div>
                                <div>
                                    <input type="text" name="longitude" placeholder="Longitude" required
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                </div>
                            </div>
                            <div class="validation-message text-xs text-red-500 mt-1"></div>
                        </div>
                    </div>
                </div>

                <!-- Type-specific Fields (HTMX loaded) -->
                <div id="type-specific-fields">
                    <!-- Will be populated via HTMX when site type is selected -->
                    <p class="text-sm text-gray-500">Select a site type to display additional fields</p>
                </div>
            </div>

            <div class="px-6 py-4 bg-gray-50 text-right">
                <a href="/sites" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 mr-2">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-4 py-2 rounded-md">
                    Create Site
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
