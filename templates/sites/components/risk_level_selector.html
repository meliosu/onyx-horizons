<select name="risk_level" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber">
    <option value="">All Risk Levels</option>
    <option value="high" {% if let Some(level) = selected_risk_level %}{% if *level == RiskLevel::High %}selected{% endif %}{% endif %}>High</option>
    <option value="medium" {% if let Some(level) = selected_risk_level %}{% if *level == RiskLevel::Medium %}selected{% endif %}{% endif %}>Medium</option>
    <option value="low" {% if let Some(level) = selected_risk_level %}{% if *level == RiskLevel::Low %}selected{% endif %}{% endif %}>Low</option>
</select>
